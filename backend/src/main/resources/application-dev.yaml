spring:
  application:
    name: sitekit-app

  datasource:
    url: jdbc:mysql://localhost:3306/sitekit_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false # for debugging
    properties:
      hibernate:
        format_sql: false # for debugging
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:/db/migration


jwt:
  secret-key: 5A7134743777217A25432A462D4A614E635266556A586E3272357538782F413F
  access-token-validity: 300000 # 5 min
  refresh-token-validity: 86400000 # 1 day

#logging:
#  level:
#    org.hibernate.SQL: DEBUG               # logs SQL statements
#    org.hibernate.type.descriptor.sql: TRACE  # logs parameter values

logging:
  level:
    root: INFO

    # Your application packages
    com.sitekit: DEBUG

    # Spring Security (VERY IMPORTANT)
    org.springframework.security: DEBUG

    # JWT parsing
    io.jsonwebtoken: DEBUG

    # Web requests
    org.springframework.web: DEBUG
