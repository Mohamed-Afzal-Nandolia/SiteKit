spring:
  application:
    name: sitekit-app

  datasource:
    url: ${DATA_SOURCE_URL}
    username: ${DATA_SOURCE_USERNAME}
    password: ${DATA_SOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false # for debugging
    properties:
      hibernate:
        format_sql: false # for debugging

  flyway:
    enabled: true
    locations: classpath:/db/migration


jwt:
  secret-key: ${JWT_SECRETE_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}
